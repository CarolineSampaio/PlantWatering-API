name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CONTINUOUS INTEGRATION (CI)
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout do repositório
        uses: actions/checkout@v4

      - name: configurar ambiente .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: restaurar pacotes NuGet (Restore)
        run: dotnet restore PlantWatering.sln

      - name: verificar formatação do código (Linter & Formatter)
        run: dotnet format PlantWatering.sln --verify-no-changes --verbosity normal

      - name: compilar solução (Build Solution)
        run: dotnet build PlantWatering.sln --configuration Release --no-restore

      # verificação preventiva: garante que futuras dependencias NuGet nao possuam vulnerabilidades
      - name: auditoria de segurança nos pacotes NuGet (DevSecOps)
        run: dotnet list PlantWatering.sln package --vulnerable --include-transitive

      - name: gerar relatório do CI no GitHub Actions
        if: success()
        run: |
          echo "### 🌿 PlantWatering API - Relatório do CI" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Setup & Restore** | ✅ Concluído | SDK .NET 10 e pacotes restaurados |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linter & Formatação** | ✅ Concluído | Código em conformidade com as regras C# |" >> $GITHUB_STEP_SUMMARY
          echo "| **Compilação (Release)** | ✅ Concluído | Build da Solution com 0 erros |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auditoria de Vulnerabilidades** | ✅ Concluído | 0 vulnerabilidades conhecidas nos pacotes |" >> $GITHUB_STEP_SUMMARY

  # CONTINUOUS DELIVERY (CD)
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: checkout do repositório
        uses: actions/checkout@v4

      - name: configurar ambiente .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: publicar aplicação (Release Publish)
        run: dotnet publish PlantWatering.Api/PlantWatering.Api.csproj --configuration Release --output ./publish

      - name: armazenar artefato de produção (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: plantwatering-api-release
          path: ./publish
          retention-days: 7
          overwrite: true

      - name: gerar relatório do CD no GitHub Actions
        if: success()
        run: |
          echo "### 🚀 Resumo do Continuous Delivery" >> $GITHUB_STEP_SUMMARY
          echo "| Parâmetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente Alvo** | Staging / Pre-Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artefato Gerado** | \`plantwatering-api-release.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Entrega** | ✅ Pronto para Deploy Contínuo |" >> $GITHUB_STEP_SUMMARY
